name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # ⚠️ باگ شناختهٔ npm با optional deps بین پلتفرم‌ها: lockfile روی ویندوز
      # ساخته شده و باینری native رول‌آپ برای لینوکس در آن نیست ⇒ vitest با
      # «Cannot find module @rollup/rollup-linux-x64-gnu» می‌شکند.
      - name: Ensure rollup native binary (linux)
        run: npm i --no-save --no-audit --no-fund @rollup/rollup-linux-x64-gnu

      # پکیج مشترک باید قبل از typecheck ساخته شود (تایپ‌های تولیدشده)
      - name: Build shared
        run: npm run build:shared

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  e2e-smoke:
    # ⚠️ فقط بعد از دیپلوی معنا دارد؛ روی PR اجرا نمی‌شود.
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test live API
        run: bash scripts/e2e-smoke.sh
