name = "kpanah-lang-edge"
main = "src/index.ts"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]

# ─────────────────────────────────────────────────────────────────────
# Custom Domain — جایگزین workers.dev (که در ایران فیلتر است)
# دامنه باید در همان حساب Cloudflare باشد و زون آن Active شده باشد.
# ─────────────────────────────────────────────────────────────────────
routes = [
  { pattern = "api.infolange.kdns.fr", custom_domain = true }
]

# مسیر مبهم‌سازی‌شده — مطابق سند امنیتی
# (در محیط production می‌توانید با env override تغییر دهید)

[observability]
enabled = true

[placement]
mode = "smart"

# ─────────────────────────────────────────────────────────────────────
# Rate limiting via KV (اختیاری ولی توصیه‌شده)
# ─────────────────────────────────────────────────────────────────────

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "5c273b38df14451aa5e0967d3f832579"
preview_id = "5c273b38df14451aa5e0967d3f832579"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "49474852f40b480d8acaf20becbc792c"
preview_id = "49474852f40b480d8acaf20becbc792c"

# ─────────────────────────────────────────────────────────────────────
# Cloudflare Queues — تولید پس‌زمینهٔ درس‌ها
# ⚠️ wrangler CLI خطای «queue settings are invalid» می‌دهد ولی صف از طریق
# REST API ساخته شده و در پلن رایگان ۱۰٬۰۰۰ عملیات در روز دارد.
# ─────────────────────────────────────────────────────────────────────

[[queues.producers]]
binding = "GENERATION_QUEUE"
queue = "kpanah-generation"

[[queues.consumers]]
queue = "kpanah-generation"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "kpanah-generation-dlq"

# ─────────────────────────────────────────────────────────────────────
# Cloudflare Workflows — تولید چرخهٔ ۷ روزه به‌صورت durable
# در پلن رایگان هم فعال است. مراحل: outline → day1..day7 → activate
# ─────────────────────────────────────────────────────────────────────

[[workflows]]
name = "kpanah-cycle-workflow"
binding = "CYCLE_WORKFLOW"
class_name = "CycleGenerationWorkflow"

# ─────────────────────────────────────────────────────────────────────
# ذخیره‌سازی رسانه — Backblaze B2 (S3-compatible)
#
# ⚠️ R2 کلادفلر در ایران در دسترس نیست، پس به B2 مهاجرت کردیم. B2 binding
# نیتیو Cloudflare ندارد → از S3 API با امضای SigV4 استفاده می‌شود
# (`services/s3.ts` + کتابخانهٔ aws4fetch).
#
# ⚠️ کلیدها **secret** هستند و این‌جا نمی‌آیند:
#   npx wrangler secret put MEDIA_S3_KEY_ID
#   npx wrangler secret put MEDIA_S3_APP_KEY
# ─────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────
# Secrets (با `wrangler secret put NAME` تنظیم کنید — در فایل نگذارید)
#
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_WEBHOOK_SECRET
#   TELEGRAM_ADMIN_BOT_TOKEN
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   JWT_SECRET
#   QSTASH_TOKEN
#   QSTASH_CURRENT_SIGNING_KEY
#   QSTASH_NEXT_SIGNING_KEY
#   GEMINI_API_KEY
#   DEEPSEEK_API_KEY
#   ANTHROPIC_API_KEY
#   MEDIA_S3_KEY_ID        ← keyID باکس B2
#   MEDIA_S3_APP_KEY       ← applicationKey باکس B2
# ─────────────────────────────────────────────────────────────────────

[vars]
MINI_APP_URL = "https://app.infolange.kdns.fr"
SELF_URL = "https://api.infolange.kdns.fr"
GATE_PATH = "/kpanah56/8fjg7rfb/v1/gate"
AI_PRIMARY_MODEL = "gemini-3.8-flash"
AI_FALLBACK_MODELS = "deepseek-chat,claude-3-5-sonnet-latest"
ENABLE_PAYLOAD_ENCRYPTION = "false"
MODULAR_GENERATION = "true"
BACKGROUND_BUDGET_MS = "20000"
# سقف مصرف توکن AI هر کاربر در ۲۴ ساعت (محافظت از کلید). ۰ = بدون سقف.
AI_TOKEN_BUDGET_PER_DAY = "300000"
# شخصی‌سازی واقعی کش درس: نقاط ضعف کاربر در کلید کش اثر می‌گذارد.
# "false" = کش کاملاً مشترک (ارزان‌تر، ولی محتوا شخصی نیست).
PERSONALIZED_CACHE = "true"
RATE_LIMIT_PER_MINUTE = "60"

# ── تبدیل متن به صوت (سرویس آنلاین، بدون AI) ───────────────────────
# موتور پیش‌فرض رایگان است و برای تلفچ کوتاه کافی است. برای تعویض:
#   TTS_BASE_URL = "https://your-tts-service.example/tts?text="
TTS_PROVIDER = "online-tts"

# ── ذخیره‌سازی رسانه (Backblaze B2 — S3 compatible) ─────────────────
MEDIA_S3_ENDPOINT = "https://s3.eu-central-003.backblazeb2.com"
MEDIA_S3_BUCKET = "kpanah-media"
MEDIA_S3_REGION = "eu-central-003"
# ⚠️ لینک صوت باید **مطلق** باشد. فرانت روی دامنهٔ دیگری است
# (app.infolange.kdns.fr)؛ اگر مسیر نسبی برگردد، مرورگر آن را نسبت به
# origin فرانت حل می‌کند → ۴۰۴. (کلاینت هم fallback دارد، ولی این‌جا
# درست ست می‌کنیم تا هر مصرف‌کننده‌ای لینک سالم بگیرد.)
MEDIA_URL_BASE = "https://api.infolange.kdns.fr/kpanah56/8fjg7rfb/v1/media"
RATE_LIMIT_PER_DAY = "2000"
FREE_TRIAL_DAYS = "7"
CYCLE_STALL_DAYS = "12"

# ─────────────────────────────────────────────────────────────────────
# Cron: انقضای اشتراک‌ها (هر ساعت)
# ─────────────────────────────────────────────────────────────────────

[triggers]
crons = ["0 * * * *", "*/5 * * * *", "0 9 * * *"]

# ─────────────────────────────────────────────────────────────────────
# محیط توسعه محلی
# ─────────────────────────────────────────────────────────────────────

[env.dev]
name = "kpanah-lang-edge-dev"

[env.dev.vars]
ENABLE_PAYLOAD_ENCRYPTION = "false"
RATE_LIMIT_PER_MINUTE = "1000"
